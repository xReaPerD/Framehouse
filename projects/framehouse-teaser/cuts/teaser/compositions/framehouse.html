  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const B = ["#fh-b1", "#fh-b2", "#fh-b3", "#fh-b4"];
      const centers = [[560, 300], [1400, 270], [600, 860], [1380, 830]];
      const drift = [[70, 40], [-60, 50], [60, -45], [-70, -35]];
      const TILES = [0, 1, 2, 3, 4, 5].map((i) => "#fh-tile" + i);
      const finalL = [480, 815, 1150], finalT = [250, 444];
      const W1 = "#fh-l1 span", W2 = "#fh-l2 span", W3 = "#fh-l3 span", WM = "#fh-word span";
      const GRID = ["#fh-gv1", "#fh-gv2", "#fh-gh"];
      const MARK = { x: 500, y: 472, s: 160 / 960 };

      // ---------- initial states (immediate, so frame 0 is right) ----------
      B.forEach((b, i) => gsap.set(b, { x: centers[i][0] - 380, y: centers[i][1] - 380, scale: 0.6, opacity: 0.55, transformOrigin: "50% 50%" }));
      gsap.set("#fh-panel", { opacity: 0, scale: 0.94, transformOrigin: "50% 50%" });
      gsap.set(GRID, { opacity: 0 });
      gsap.set(["#fh-gv1", "#fh-gv2"], { scaleY: 0, transformOrigin: "50% 50%" });
      gsap.set("#fh-gh", { scaleX: 0, transformOrigin: "50% 50%" });
      gsap.set(["#fh-label", "#fh-cursor"], { opacity: 0 });
      gsap.set(["#fh-t1", "#fh-t2"], { clipPath: "inset(0 100% 0 0)" });
      gsap.set([W1, W2, W3], { opacity: 0, filter: "blur(10px)" });
      TILES.forEach((t, i) => {
        const c = i % 3, r = Math.floor(i / 3);
        gsap.set(t, { transformOrigin: "0 0", x: 480 + 320 * c - finalL[c], y: 270 + 180 * r - finalT[r], scale: 320 / 290, opacity: 0 });
      });
      gsap.set(".fh-key", { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" });
      gsap.set("#fh-chip", { opacity: 0, scale: 0.7, transformOrigin: "50% 50%" });
      gsap.set("#fh-check", { attr: { "stroke-dashoffset": 1.1 } });
      gsap.set("#fh-track", { opacity: 0, scaleX: 0.92, transformOrigin: "50% 50%" });
      gsap.set(".fh-tick", { opacity: 0 });
      gsap.set("#fh-playhead", { opacity: 0, x: 0 });
      gsap.set(["#fh-bar", "#fh-file", "#fh-pct"], { opacity: 0 });
      gsap.set("#fh-fill", { scaleX: 0, opacity: 0, transformOrigin: "0% 50%" });
      gsap.set("#fh-play", { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" });
      gsap.set("#fh-mark", { opacity: 0 });
      gsap.set(WM, { opacity: 0, filter: "blur(12px)", y: 10 });
      gsap.set("#fh-tag", { opacity: 0, filter: "blur(8px)" });

      // ---------- background drift (whole film, settles by 13 s) ----------
      B.forEach((b, i) => {
        tl.to(b, { opacity: 0.85, scale: 1, duration: 1.1, ease: "expo.out" }, 0.3 + i * 0.12);
        tl.to(b, { x: "+=" + drift[i][0], y: "+=" + drift[i][1], duration: 13, ease: "sine.inOut" }, 0);
      });

      // ---------- 1 · glass forms 0–2 ----------
      tl.to("#fh-panel", { opacity: 1, scale: 1, duration: 0.9, ease: "expo.out" }, 0.9);

      // ---------- 2 · describe 2.0–4.8 ----------
      tl.to(["#fh-label", "#fh-cursor"], { opacity: 1, duration: 0.2 }, 1.85);
      tl.to("#fh-t1", { clipPath: "inset(0 0% 0 0)", duration: 0.8, ease: "steps(26)" }, 2.1);
      tl.to("#fh-cursor", { x: 26 * 24 + 4, duration: 0.8, ease: "steps(26)" }, 2.1);
      tl.set("#fh-cursor", { x: 0, y: 64 }, 2.98);
      tl.to("#fh-t2", { clipPath: "inset(0 0% 0 0)", duration: 0.7, ease: "steps(23)" }, 3.0);
      tl.to("#fh-cursor", { x: 23 * 24 + 4, duration: 0.7, ease: "steps(23)" }, 3.0);
      tl.to("#fh-cursor", { opacity: 0, duration: 0.01, repeat: 4, yoyo: true, repeatDelay: 0.14 }, 3.8);
      tl.to(W1, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out", stagger: 0.1 }, 2.5);
      tl.to(W1, { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power2.in", stagger: 0.06 }, 4.45);
      tl.to(["#fh-label", "#fh-t1", "#fh-t2", "#fh-cursor"], { opacity: 0, duration: 0.25, ease: "power2.in" }, 4.5);

      // ---------- 3 · approve 4.8–7.8 ----------
      tl.to(GRID, { opacity: 1, duration: 0.15 }, 4.7);
      tl.to(["#fh-gv1", "#fh-gv2"], { scaleY: 1, duration: 0.3, ease: "power3.out" }, 4.7);
      tl.to("#fh-gh", { scaleX: 1, duration: 0.3, ease: "power3.out" }, 4.75);
      tl.set(TILES, { opacity: 1 }, 5.05);
      tl.set(GRID, { opacity: 0 }, 5.05);
      tl.set("#fh-panel", { opacity: 0 }, 5.05);
      tl.to(TILES, { x: 0, y: 0, scale: 1, duration: 0.65, ease: "power3.inOut", stagger: 0.03 }, 5.05);
      tl.to(".fh-key", { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out", stagger: 0.14 }, 5.55);
      tl.to(W2, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out", stagger: 0.1 }, 5.4);
      tl.to("#fh-chip", { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" }, 6.75);
      tl.to("#fh-check", { attr: { "stroke-dashoffset": 0 }, duration: 0.3, ease: "power2.out" }, 6.9);
      tl.to(W2, { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power2.in", stagger: 0.06 }, 7.5);
      tl.to("#fh-chip", { opacity: 0, scale: 0.85, duration: 0.25, ease: "power2.in" }, 7.55);

      // ---------- 4 · render 7.8–11.0 ----------
      TILES.forEach((t, i) => {
        const c = i % 3, r = Math.floor(i / 3);
        tl.to(t, { x: 480 + 161 * i - finalL[c], y: 370 - finalT[r], scale: 152 / 290, duration: 0.7, ease: "power3.inOut" }, 7.8 + i * 0.03);
      });
      tl.to("#fh-track", { opacity: 1, scaleX: 1, duration: 0.6, ease: "expo.out" }, 8.0);
      tl.to(".fh-tick", { opacity: 1, duration: 0.2, stagger: 0.04 }, 8.35);
      tl.to(["#fh-bar", "#fh-file", "#fh-pct"], { opacity: 1, duration: 0.3 }, 8.4);
      tl.to(W3, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out", stagger: 0.1 }, 8.3);
      tl.to("#fh-playhead", { opacity: 1, duration: 0.15 }, 8.55);
      tl.to("#fh-playhead", { x: 960, duration: 1.7, ease: "none" }, 8.6);
      tl.set("#fh-fill", { opacity: 1 }, 8.6);
      tl.to("#fh-fill", { scaleX: 1, duration: 1.7, ease: "power1.inOut" }, 8.6);
      const pct = { v: 0 };
      tl.to(pct, { v: 100, duration: 1.7, ease: "power1.inOut",
        onUpdate: () => { document.querySelector("#fh-pct").textContent = Math.round(pct.v) + "%"; } }, 8.6);
      tl.to("#fh-pct", { color: "#9BE15D", duration: 0.2 }, 10.3);
      tl.to(W3, { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power2.in", stagger: 0.06 }, 10.45);
      // fold back into one panel
      tl.to([...TILES, "#fh-track", ".fh-tick", "#fh-playhead", "#fh-bar", "#fh-fill", "#fh-file", "#fh-pct"],
        { opacity: 0, duration: 0.3, ease: "power2.in" }, 10.55);
      tl.to("#fh-panel", { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, 10.6);
      tl.to("#fh-play", { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out" }, 10.75);

      // ---------- 5 · breath 11.0–11.8 (still) ----------

      // ---------- 6 · end card 11.8–15 ----------
      tl.to("#fh-play", { opacity: 0, scale: 0.6, duration: 0.2, ease: "power2.in" }, 11.75);
      tl.set("#fh-panel", { transformOrigin: "0 0" }, 11.8);
      tl.to("#fh-panel", { x: MARK.x - 480, y: MARK.y - 270, scale: MARK.s, duration: 0.6, ease: "power3.inOut" }, 11.8);
      tl.to("#fh-mark", { opacity: 1, duration: 0.2 }, 12.3);
      tl.to("#fh-panel", { opacity: 0, duration: 0.15 }, 12.35);
      tl.to(WM, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.3, ease: "power2.out", stagger: 0.04 }, 12.25);
      tl.to("#fh-tag", { opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 12.6);

      window.__timelines["fh"] = tl;
    })();
  </script>
